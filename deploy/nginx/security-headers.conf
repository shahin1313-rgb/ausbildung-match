# Include this file inside the HTTPS server block. Keep these values in sync
# with config/security-headers.php. Disable the Laravel middleware only if the
# reverse proxy is the single intended owner of all security headers.
# The proxy policy is deliberately compatible with Filament/Livewire. Laravel
# sends a second, stricter policy on public routes; browsers enforce both.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header X-Frame-Options "DENY" always;
